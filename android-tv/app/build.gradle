plugins {
    id "com.android.application"
}

android {
    namespace "com.ronky.opencamara.tv"
    compileSdk 35

    defaultConfig {
        applicationId "com.ronky.opencamara.tv"
        minSdk 23
        targetSdk 35
        versionCode 6
        versionName "1.0.5"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
